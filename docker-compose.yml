services:
  minisky-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: minisky:latest
    container_name: minisky-cli
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount config directory
      - ~/.minisky:/root/.minisky
      # Mount current directory for tasks and workdir
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["minisky"]
    stdin_open: true
    tty: true

  # Optional: API server, and the web dashboard if it has been built
  # (cd dashboard && npm install && npm run build) - `minisky serve` hosts
  # both from one process, so there is no separate dashboard service.
  minisky-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: minisky:latest
    container_name: minisky-api
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.minisky:/root/.minisky
      - .:/workspace
    ports:
      - "8000:8000"
    working_dir: /workspace
    entrypoint: ["minisky", "serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
